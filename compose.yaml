name: vuln-audit

# One audit application plus an optional, isolated POC environment.  The default profile
# set comes from COMPOSE_PROFILES in .env: with `poc`, `docker compose up` also starts a
# local Lab30 target and the poc-runner container that executes model-written POCs.  Empty
# COMPOSE_PROFILES keeps the original single-service audit stack.
#
# The app never receives the Docker socket.  The runner has no published port, no volume,
# no route to the model endpoint and no route to the internet.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: vuln-audit:local
    ports:
      # 8899 is the documented address; AUDIT_PORT exists only so a machine that already has
      # something on 8899 can still start the stack without stopping the other service.
      - "127.0.0.1:${AUDIT_PORT:-8899}:8899"
    environment:
      AUDIT_DATA_DIR: /app/data
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_THINKING: ${LLM_THINKING:-disabled}
      # Empty URL disables automatic verification; the run still closes and every finding
      # is reported as unverified.  .env.example points this at the Compose service.
      POC_ENABLED: ${POC_ENABLED:-1}
      POC_REQUIRED: ${POC_REQUIRED:-0}
      POC_TARGET: lab30
      POC_RUNNER_URL: ${POC_RUNNER_URL:-}
      POC_RUNNER_TOKEN: ${POC_RUNNER_TOKEN:-}
      POC_RUNNER_ADDRS: ${POC_RUNNER_ADDRS:-}
      POC_BROWSER: ${POC_BROWSER:-1}
      POC_JOB_SECONDS: ${POC_JOB_SECONDS:-30}
      POC_MAX_STEPS: ${POC_MAX_STEPS:-8}
      POC_MAX_JOBS: ${POC_MAX_JOBS:-8}
      POC_MAX_SECONDS: ${POC_MAX_SECONDS:-300}
      POC_CONCURRENCY: ${POC_CONCURRENCY:-2}
    volumes:
      - audit-data:/app/data
    extra_hosts:
      # Lets the audit container reach a model endpoint published on the host.
      - "host.docker.internal:host-gateway"
    networks:
      default: {}
      poc-control: {}
    restart: unless-stopped
    init: true

  # ------------------------------------------------------------------ POC environment

  lab30-db:
    build:
      context: ./labs/lab30
      dockerfile: docker/db.Dockerfile
    image: vuln-audit-lab30-db:1.0.0
    profiles: ["poc"]
    environment:
      MARIADB_ROOT_PASSWORD: ${LAB30_DB_ROOT_PASSWORD:-lab30-local-root}
      MARIADB_DATABASE: shop
      MARIADB_USER: shop
      MARIADB_PASSWORD: ${LAB30_DB_PASSWORD:-lab30-local-password}
    volumes:
      - lab30-db-data:/var/lib/mysql
    networks: [lab30-db-net]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  lab30-fixtures:
    build:
      context: ./labs/lab30
      dockerfile: docker/fixtures.Dockerfile
    image: vuln-audit-lab30-fixtures:1.0.0
    profiles: ["poc"]
    networks:
      poc-target:
        aliases: [fixtures]
    read_only: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  lab30:
    build:
      context: ./labs/lab30
      dockerfile: docker/web.Dockerfile
      args:
        HTTP_PROXY: ${SHOP_BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${SHOP_BUILD_HTTPS_PROXY:-}
    image: vuln-audit-lab30-web:1.0.0
    profiles: ["poc"]
    environment:
      DB_HOST: lab30-db
      DB_NAME: shop
      DB_USER: shop
      DB_PASSWORD: ${LAB30_DB_PASSWORD:-lab30-local-password}
      SHOP_DATA_DIR: /var/lib/shop
    ports:
      - "127.0.0.1:${LAB30_PORT:-18880}:80"
    volumes:
      - lab30-runtime:/var/lib/shop
    depends_on:
      lab30-db:
        condition: service_healthy
      lab30-fixtures:
        condition: service_healthy
    networks: [lab30-db-net, poc-target]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/health.php') === false ? 1 : 0);"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  poc-runner:
    build:
      context: ./poc_runner
      args:
        INSTALL_BROWSER: ${POC_BROWSER:-1}
    profiles: ["poc"]
    environment:
      POC_RUNNER_TOKEN: ${POC_RUNNER_TOKEN:-}
      POC_RUNNER_CONCURRENCY: ${POC_CONCURRENCY:-2}
      LAB30_URL: http://lab30
      LAB30_USER: ${LAB30_USER:-alice}
      LAB30_PASSWORD: ${LAB30_PASSWORD:-Alice123!}
    networks:
      - poc-target
      - poc-control
    depends_on:
      lab30:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "10002:10002"
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    shm_size: 256m
    restart: unless-stopped
    init: true

networks:
  # app <-> runner only; no gateway to the outside.
  poc-control:
    internal: true
  # runner <-> Lab30 and its fixture service only; neither side can reach the internet through it.
  poc-target:
    internal: true
  lab30-db-net:
    internal: true

volumes:
  audit-data:
  lab30-db-data:
  lab30-runtime:
