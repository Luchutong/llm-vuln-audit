name: vuln-audit

# One audit application plus an optional, isolated POC environment.  The default profile
# set comes from COMPOSE_PROFILES in .env: with `poc`, `docker compose up` also starts a
# local Lab30 target and the poc-runner container that executes model-written POCs.  Empty
# COMPOSE_PROFILES keeps the original single-service audit stack.
#
# The app never receives the Docker socket.  The runner has no published port, no volume,
# no route to the model endpoint and no route to the internet.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: vuln-audit:local
    ports:
      # 8899 is the documented address; AUDIT_PORT exists only so a machine that already has
      # something on 8899 can still start the stack without stopping the other service.
      - "127.0.0.1:${AUDIT_PORT:-8899}:8899"
    environment:
      AUDIT_DATA_DIR: /app/data
      LAB30_SEED: ${LAB30_SEED:-1}
      LAB30_SOURCE_ZIP: ${LAB30_SOURCE_ZIP:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_THINKING: ${LLM_THINKING:-disabled}
      LLM_STRUCTURED_OUTPUT: ${LLM_STRUCTURED_OUTPUT:-compatible}
      AUDIT_HISTORY_BYTES: ${AUDIT_HISTORY_BYTES:-393216}
      AUDIT_HISTORY_SUMMARY: ${AUDIT_HISTORY_SUMMARY:-1}
      AUDIT_HISTORY_SUMMARY_BYTES: ${AUDIT_HISTORY_SUMMARY_BYTES:-4096}
      AUDIT_HISTORY_SUMMARY_INPUT_BYTES: ${AUDIT_HISTORY_SUMMARY_INPUT_BYTES:-49152}
      AUDIT_HISTORY_SUMMARY_MAX_TOKENS: ${AUDIT_HISTORY_SUMMARY_MAX_TOKENS:-1536}
      AUDIT_HISTORY_SUMMARY_RESPONSES: ${AUDIT_HISTORY_SUMMARY_RESPONSES:-2}
      AUDIT_HISTORY_SUMMARY_RUN_RESPONSES: ${AUDIT_HISTORY_SUMMARY_RUN_RESPONSES:-8}
      AUDIT_HISTORY_ACTION_BYTES: ${AUDIT_HISTORY_ACTION_BYTES:-2048}
      AUDIT_HISTORY_OBSERVATION_BYTES: ${AUDIT_HISTORY_OBSERVATION_BYTES:-1024}
      AUDIT_PLANNER_PINNED_BYTES: ${AUDIT_PLANNER_PINNED_BYTES:-16384}
      AUDIT_PLANNER_PINNED_HARD_BYTES: ${AUDIT_PLANNER_PINNED_HARD_BYTES:-32768}
      AUDIT_SOURCE_BYTES: ${AUDIT_SOURCE_BYTES:-65536}
      AUDIT_TOOL_BYTES: ${AUDIT_TOOL_BYTES:-16384}
      AUDIT_CODE_OUTPUT_BYTES: ${AUDIT_CODE_OUTPUT_BYTES:-24576}
      AUDIT_PLANNER_MAX_TOKENS: ${AUDIT_PLANNER_MAX_TOKENS:-8192}
      AUDIT_WORKER_MAX_TOKENS: ${AUDIT_WORKER_MAX_TOKENS:-4096}
      AUDIT_RECON_MAX_TOKENS: ${AUDIT_RECON_MAX_TOKENS:-2048}
      AUDIT_POC_MAX_TOKENS: ${AUDIT_POC_MAX_TOKENS:-4096}
      # Empty URL disables automatic verification; the run still closes and every finding
      # is reported as unverified.  .env.example points this at the Compose service.
      POC_ENABLED: ${POC_ENABLED:-1}
      POC_TARGET: lab30
      POC_RUNNER_URL: ${POC_RUNNER_URL:-}
      POC_RUNNER_TOKEN: ${POC_RUNNER_TOKEN:-}
      POC_RUNNER_ADDRS: ${POC_RUNNER_ADDRS:-}
      POC_BROWSER: ${POC_BROWSER:-1}
      POC_JOB_SECONDS: ${POC_JOB_SECONDS:-30}
      POC_MAX_STEPS: ${POC_MAX_STEPS:-8}
      POC_MAX_JOBS: ${POC_MAX_JOBS:-8}
      POC_MAX_SECONDS: ${POC_MAX_SECONDS:-300}
      POC_CONCURRENCY: ${POC_CONCURRENCY:-2}
      # The SDK lives in the app; upstream credentials never enter the runner.
      POC_RUNTIME: ${POC_RUNTIME:-legacy}
      POC_CLAUDE_MODEL: ${POC_CLAUDE_MODEL:-}
      POC_CLAUDE_GATEWAY_ENABLED: ${POC_CLAUDE_GATEWAY_ENABLED:-0}
      # Container addresses are independent from the host's AUDIT_PORT/workspace.
      POC_CLAUDE_GATEWAY_URL: http://127.0.0.1:8899/api/internal/poc-gateway
      POC_CLAUDE_WORKSPACE: /tmp/audit-poc-workspace
      POC_CLAUDE_UPSTREAM_URL: ${POC_CLAUDE_UPSTREAM_URL:-}
      POC_CLAUDE_UPSTREAM_API_KEY: ${POC_CLAUDE_UPSTREAM_API_KEY:-}
      POC_CLAUDE_SDK_VERSION: ${POC_CLAUDE_SDK_VERSION:-0.2.174}
      POC_CLAUDE_CLI_VERSION: ${POC_CLAUDE_CLI_VERSION:-2.1.310}
      POC_CLAUDE_REQUEST_SECONDS: ${POC_CLAUDE_REQUEST_SECONDS:-180}
      POC_CLAUDE_STREAM_IDLE_SECONDS: ${POC_CLAUDE_STREAM_IDLE_SECONDS:-120}
      POC_CLAUDE_EXECUTE_REQUESTS: ${POC_CLAUDE_EXECUTE_REQUESTS:-40}
      POC_CLAUDE_CONCLUDE_REQUESTS: ${POC_CLAUDE_CONCLUDE_REQUESTS:-3}
      POC_CLAUDE_EXECUTE_TURNS: ${POC_CLAUDE_EXECUTE_TURNS:-24}
      POC_CLAUDE_CONCLUDE_TURNS: ${POC_CLAUDE_CONCLUDE_TURNS:-4}
      POC_CLAUDE_MAX_SECONDS: ${POC_CLAUDE_MAX_SECONDS:-300}
      POC_CLAUDE_EXECUTE_USD: ${POC_CLAUDE_EXECUTE_USD:-}
      POC_CLAUDE_CONCLUDE_USD: ${POC_CLAUDE_CONCLUDE_USD:-}
      POC_SDK_OUTPUT_POLICY: ${POC_SDK_OUTPUT_POLICY:-bounded-v1}
      POC_SDK_EXECUTE_OUTPUT_TOKENS: ${POC_SDK_EXECUTE_OUTPUT_TOKENS:-4096}
      POC_SDK_PUBLISH_OUTPUT_TOKENS: ${POC_SDK_PUBLISH_OUTPUT_TOKENS:-1024}
      POC_SDK_THINKING: ${POC_SDK_THINKING:-disabled}
    volumes:
      - audit-data:/app/data
    extra_hosts:
      # Lets the audit container reach a model endpoint published on the host.
      - "host.docker.internal:host-gateway"
    networks:
      default: {}
      poc-control: {}
    restart: unless-stopped
    init: true

  # ------------------------------------------------------------------ POC environment

  lab30-db:
    build:
      context: ./labs/lab30
      dockerfile: docker/db.Dockerfile
    image: vuln-audit-lab30-db:1.0.0
    profiles: ["poc"]
    environment:
      MARIADB_ROOT_PASSWORD: ${LAB30_DB_ROOT_PASSWORD:-lab30-local-root}
      MARIADB_DATABASE: shop
      MARIADB_USER: shop
      MARIADB_PASSWORD: ${LAB30_DB_PASSWORD:-lab30-local-password}
    volumes:
      - lab30-db-data:/var/lib/mysql
    networks: [lab30-db-net]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  lab30-fixtures:
    build:
      context: ./labs/lab30
      dockerfile: docker/fixtures.Dockerfile
    image: vuln-audit-lab30-fixtures:1.0.0
    profiles: ["poc"]
    networks:
      poc-target:
        aliases: [fixtures]
    read_only: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  lab30:
    build:
      context: ./labs/lab30
      dockerfile: docker/web.Dockerfile
      args:
        HTTP_PROXY: ${SHOP_BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${SHOP_BUILD_HTTPS_PROXY:-}
    image: vuln-audit-lab30-web:1.0.0
    profiles: ["poc"]
    environment:
      DB_HOST: lab30-db
      DB_NAME: shop
      DB_USER: shop
      DB_PASSWORD: ${LAB30_DB_PASSWORD:-lab30-local-password}
      SHOP_DATA_DIR: /var/lib/shop
    ports:
      - "127.0.0.1:${LAB30_PORT:-18880}:80"
    volumes:
      - lab30-runtime:/var/lib/shop
    depends_on:
      lab30-db:
        condition: service_healthy
      lab30-fixtures:
        condition: service_healthy
    networks: [lab30-db-net, poc-target, lab30-edge]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/health.php') === false ? 1 : 0);"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  poc-runner:
    build:
      context: ./poc_runner
      args:
        INSTALL_BROWSER: ${POC_BROWSER:-1}
    profiles: ["poc"]
    environment:
      POC_RUNNER_TOKEN: ${POC_RUNNER_TOKEN:-}
      POC_RUNNER_CONCURRENCY: ${POC_CONCURRENCY:-2}
      LAB30_URL: http://lab30
      LAB30_USER: ${LAB30_USER:-alice}
      LAB30_PASSWORD: ${LAB30_PASSWORD:-Alice123!}
      LAB30_BOB_USER: ${LAB30_BOB_USER:-bob}
      LAB30_BOB_PASSWORD: ${LAB30_BOB_PASSWORD:-Bob123!}
      LAB30_OPERATOR_USER: ${LAB30_OPERATOR_USER:-operator}
      LAB30_OPERATOR_PASSWORD: ${LAB30_OPERATOR_PASSWORD:-Ops123!}
      LAB30_ADMIN_USER: ${LAB30_ADMIN_USER:-admin}
      LAB30_ADMIN_PASSWORD: ${LAB30_ADMIN_PASSWORD:-Admin123!}
    networks:
      - poc-target
      - poc-control
    depends_on:
      lab30:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "10002:10002"
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    shm_size: 256m
    restart: unless-stopped
    init: true

  # Host-side access to the isolated runner, only needed when the audit app itself runs on
  # the host (scripts/start.sh --poc) instead of in Compose.  The runner keeps publishing
  # nothing and stays off any host-facing network; this dumb TCP hop is the single thing
  # that touches both the internal control network and the host loopback.
  poc-runner-dev:
    build:
      context: ./poc_runner
      dockerfile: relay.Dockerfile
    image: vuln-audit-poc-relay:local
    pull_policy: build
    profiles: ["poc"]
    networks: [poc-control, lab30-edge]
    ports:
      - "127.0.0.1:${POC_RUNNER_DEV_PORT:-18089}:8080"
    depends_on:
      - poc-runner
    healthcheck:
      test: ["CMD", "python", "-I", "-c", "import http.client; c = http.client.HTTPConnection('127.0.0.1', 8080, timeout=3); c.request('GET', '/healthz'); exit(0 if c.getresponse().status == 200 else 1)"]
      interval: 5s
      timeout: 4s
      retries: 12
    restart: unless-stopped
    init: true
    read_only: true
    user: "10002:10002"
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 32
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  # app <-> runner only; no gateway to the outside.
  poc-control:
    internal: true
  # runner <-> Lab30 and its fixture service only; neither side can reach the internet through it.
  poc-target:
    internal: true
  lab30-db-net:
    internal: true
  # The only host-facing network: a container attached solely to ``internal`` networks gets
  # no published port at all, so the shop's 127.0.0.1:18880 mapping silently did nothing.
  # Keep it to the web tier; the database and the runner stay off it.
  lab30-edge:
    driver: bridge

volumes:
  audit-data:
  lab30-db-data:
  lab30-runtime:
