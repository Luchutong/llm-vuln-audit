name: vuln-audit

# One service: the source-audit application.  It accepts any PHP source archive through the
# UI/API; no target, sample project or project-specific archive is mounted into the
# container, and no target ships with this repository.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: vuln-audit:local
    ports:
      # 8899 is the documented address; AUDIT_PORT exists only so a machine that already has
      # something on 8899 can still start the stack without stopping the other service.
      - "127.0.0.1:${AUDIT_PORT:-8899}:8899"
    environment:
      AUDIT_DATA_DIR: /app/data
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_THINKING: ${LLM_THINKING:-disabled}
    volumes:
      - audit-data:/app/data
    extra_hosts:
      # Lets the audit container reach a model endpoint published on the host.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    init: true

volumes:
  audit-data:
