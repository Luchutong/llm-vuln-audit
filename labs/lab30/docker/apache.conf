ServerName localhost
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/shop/public
    <Directory /var/www/shop/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
