date.timezone = Asia/Shanghai
allow_url_fopen = On
allow_url_include = On
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
session.use_strict_mode = 0
session.save_path = /var/lib/shop/sessions
memory_limit = 128M
post_max_size = 2M
max_execution_time = 15
default_socket_timeout = 4
expose_php = Off
